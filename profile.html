<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Muted Warm</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }

  /* 🎨 MUTED WARM PALETTE
     #F5EBE0  warm sand (bg)
     #D5BDAF  taupe
     #C9A78E  caramel muted
     #B5836A  terracotta soft
     #A0624A  clay
     #8B5E52  warm brown
     #7A4A3F  deep umber
     #5C3A33  dark cocoa (text utama)
     #8B6F63  mocha (text sekunder)
  */

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #F5EBE0 0%, #D5BDAF 50%, #C9A78E 100%);
    background-size: 200% 200%;
    animation: bgShift 16s ease infinite;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* 🌾 Floating soft blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
  }
  .blob-1 {
    width: 320px; height: 320px;
    background: #C9A78E;
    top: -90px; left: -90px;
    animation: floatBlob 16s ease-in-out infinite;
  }
  .blob-2 {
    width: 360px; height: 360px;
    background: #B5836A;
    bottom: -110px; right: -90px;
    animation: floatBlob 20s ease-in-out infinite reverse;
  }
  .blob-3 {
    width: 240px; height: 240px;
    background: #D5BDAF;
    top: 45%; left: 62%;
    animation: floatBlob 18s ease-in-out infinite;
  }
  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.08); }
  }

  /* ✨ Floating sparkles - subtle */
  .sparkle {
    position: fixed;
    font-size: 16px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 1;
    animation: sparkleFloat 9s ease-in-out infinite;
    filter: sepia(0.3);
  }
  .sparkle-1 { top: 14%; left: 12%; animation-delay: 0s; }
  .sparkle-2 { top: 74%; left: 10%; animation-delay: 2.5s; font-size: 18px; }
  .sparkle-3 { top: 24%; right: 12%; animation-delay: 4s; }
  .sparkle-4 { bottom: 20%; right: 14%; animation-delay: 1.5s; font-size: 14px; }
  @keyframes sparkleFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
    50% { transform: translateY(-18px) rotate(15deg); opacity: 0.5; }
  }

  .card {
    background: #FBF5EE;
    width: 100%;
    max-width: 380px;
    border-radius: 24px;
    box-shadow:
      0 20px 50px rgba(92, 58, 51, 0.18),
      0 0 0 1px rgba(255, 255, 255, 0.5) inset;
    overflow: hidden;
    text-align: center;
    position: relative;
    z-index: 2;
    animation: fadeUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow:
      0 28px 60px rgba(92, 58, 51, 0.24),
      0 0 0 1px rgba(255, 255, 255, 0.6) inset;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 🌅 Banner muted warm */
  .banner {
    height: 125px;
    background: linear-gradient(135deg,
      #D5BDAF 0%,
      #C9A78E 35%,
      #B5836A 65%,
      #A0624A 100%);
    background-size: 200% 200%;
    animation: bannerFlow 10s ease infinite;
    position: relative;
    overflow: hidden;
  }
  @keyframes bannerFlow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Soft glow di banner */
  .banner::before {
    content: '';
    position: absolute;
    top: 25px; right: 35px;
    width: 45px; height: 45px;
    background: radial-gradient(circle, #F5EBE0 0%, #E5CDB5 45%, transparent 75%);
    border-radius: 50%;
    box-shadow: 0 0 35px rgba(245, 235, 224, 0.6);
    animation: softPulse 4s ease-in-out infinite;
  }
  @keyframes softPulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  /* Shine sweep - lebih halus */
  .banner::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    animation: shineSweep 5s ease-in-out infinite;
  }
  @keyframes shineSweep {
    0% { left: -100%; }
    50%, 100% { left: 100%; }
  }

  /* ✨ Avatar dengan ring lembut */
  .avatar-wrap {
    position: relative;
    display: inline-block;
    margin-top: -62px;
  }

  .avatar-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #D5BDAF, #C9A78E, #B5836A, #A0624A, #D5BDAF);
    animation: rotateRing 8s linear infinite;
    z-index: 0;
  }
  @keyframes rotateRing {
    to { transform: rotate(360deg); }
  }

  .avatar-ring-inner {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: #FBF5EE;
    z-index: 1;
  }

  .avatar {
    position: relative;
    width: 115px;
    height: 115px;
    border-radius: 50%;
    object-fit: cover;
    background: #E5CDB5;
    z-index: 2;
    display: block;
    animation: avatarPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    transition: transform 0.35s ease;
    filter: sepia(0.15) saturate(0.9);
  }
  .avatar:hover {
    transform: scale(1.05);
    filter: sepia(0) saturate(1);
  }
  @keyframes avatarPop {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Online dot - muted green */
  .online-dot {
    position: absolute;
    bottom: 8px;
    right: 8px;
    width: 17px;
    height: 17px;
    background: #8FAE7E;
    border: 3px solid #FBF5EE;
    border-radius: 50%;
    z-index: 3;
    animation: pulseOnline 2.5s ease-in-out infinite;
  }
  @keyframes pulseOnline {
    0%, 100% { box-shadow: 0 0 0 0 rgba(143, 174, 126, 0.55); }
    50% { box-shadow: 0 0 0 6px rgba(143, 174, 126, 0); }
  }

  /* Name - warna solid, tidak shimmer */
  .name {
    font-size: 21px;
    font-weight: 800;
    color: #5C3A33;
    margin-top: 16px;
    letter-spacing: -0.2px;
    animation: fadeUp 0.6s ease 0.3s both;
    transition: color 0.3s ease;
  }
  .name:hover {
    color: #A0624A;
  }

  .role {
    font-size: 13px;
    color: #8B6F63;
    margin-top: 4px;
    font-weight: 500;
    animation: fadeUp 0.6s ease 0.4s both;
  }

  .bio {
    font-size: 13.5px;
    color: #7A4A3F;
    line-height: 1.6;
    padding: 14px 26px 0;
    animation: fadeUp 0.6s ease 0.5s both;
    opacity: 0.9;
  }

  .stats {
    display: flex;
    justify-content: space-around;
    padding: 18px 0;
    margin-top: 18px;
    border-top: 1px solid #E8DBCE;
    border-bottom: 1px solid #E8DBCE;
    animation: fadeUp 0.6s ease 0.6s both;
  }

  .stat {
    cursor: default;
    transition: transform 0.3s ease;
  }
  .stat:hover {
    transform: translateY(-3px);
  }

  .stat h3 {
    font-size: 18px;
    color: #A0624A;
    font-weight: 800;
    transition: color 0.3s ease;
  }
  .stat:hover h3 {
    color: #7A4A3F;
  }
  .stat p {
    font-size: 11px;
    color: #8B6F63;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-top: 2px;
    font-weight: 600;
  }

  .actions {
    display: flex;
    gap: 10px;
    padding: 18px 24px;
    animation: fadeUp 0.6s ease 0.7s both;
  }

  .btn {
    flex: 1;
    padding: 12px 0;
    border: none;
    border-radius: 13px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    display: inline-block;
    text-align: center;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.2px;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.5s, height 0.5s;
  }
  .btn:hover::before {
    width: 300px;
    height: 300px;
  }

  /* Tombol follow - muted terracotta */
  .btn-primary {
    background: linear-gradient(135deg, #B5836A, #A0624A);
    color: #FBF5EE;
    box-shadow: 0 5px 14px rgba(160, 98, 74, 0.3);
    position: relative;
    z-index: 1;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(160, 98, 74, 0.4);
  }
  .btn-primary.following {
    background: linear-gradient(135deg, #8FAE7E, #6E8F5C);
    box-shadow: 0 5px 14px rgba(110, 143, 92, 0.35);
    color: #FBF5EE;
  }
  .btn-primary.following:hover {
    box-shadow: 0 10px 22px rgba(110, 143, 92, 0.5);
  }

  /* Tombol message - outline warm */
  .btn-outline {
    background: #F5EBE0;
    color: #8B5E52;
    border: 2px solid #E0CDBB;
    position: relative;
    z-index: 1;
  }
  .btn-outline:hover {
    background: #E8DBCE;
    color: #5C3A33;
    border-color: #C9A78E;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(201, 167, 142, 0.4);
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding-bottom: 22px;
    animation: fadeUp 0.6s ease 0.8s both;
  }

  .socials a {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #F5EBE0;
    color: #8B5E52;
    font-size: 11px;
    font-weight: 800;
    text-decoration: none;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 2px solid #E8DBCE;
    letter-spacing: 0.5px;
  }
  .socials a:hover {
    background: #B5836A;
    color: #FBF5EE;
    border-color: #A0624A;
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 10px 20px rgba(160, 98, 74, 0.35);
  }

  /* 🎉 Heart burst - muted */
  .heart-burst {
    position: fixed;
    font-size: 22px;
    pointer-events: none;
    z-index: 999;
    animation: burstUp 1.1s ease-out forwards;
    filter: sepia(0.3) drop-shadow(0 2px 6px rgba(160, 98, 74, 0.4));
  }
  @keyframes burstUp {
    0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(140deg); opacity: 0; }
  }
</style>
</head>
<body>

  <!-- Floating muted blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Sparkles -->
  <div class="sparkle sparkle-1">🌾</div>
  <div class="sparkle sparkle-2">🍂</div>
  <div class="sparkle sparkle-3">✨</div>
  <div class="sparkle sparkle-4">🌿</div>

  <div class="card">
    <div class="banner"></div>

    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar-ring-inner"></div>
      <img
        class="avatar"
        src="https://ui-avatars.com/api/?name=Capcay&background=B5836A&color=FBF5EE&size=200&bold=true"
        alt="Avatar"
      >
      <span class="online-dot" title="Online"></span>
    </div>

    <h2 class="name">Capcay</h2>
    <p class="role">coba-coba · Sidoarjo</p>

    <p class="bio">
      Suka belajar, coklat, dan hal-hal baru.
    </p>

    <div class="stats">
      <div class="stat"><h3 data-count="128">0</h3><p>Post</p></div>
      <div class="stat"><h3 data-count="2400">0</h3><p>Follower</p></div>
      <div class="stat"><h3 data-count="312">0</h3><p>Following</p></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="followBtn" onclick="followMe(this, event)">Follow</button>
      <a href="#" class="btn btn-outline">Message</a>
    </div>

    <div class="socials">
      <a href="#" title="GitHub">GH</a>
      <a href="#" title="Twitter">TW</a>
      <a href="#" title="Instagram">IG</a>
      <a href="#" title="LinkedIn">IN</a>
    </div>
  </div>

  <script>
    // 🔢 Animated counter
    function animateCounters() {
      document.querySelectorAll('[data-count]').forEach(el => {
        const target = parseInt(el.dataset.count);
        const duration = 1500;
        const start = performance.now();

        function update(now) {
          const progress = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const value = Math.floor(eased * target);

          if (target >= 1000) {
            el.textContent = (value / 1000).toFixed(1) + 'k';
          } else {
            el.textContent = value;
          }

          if (progress < 1) requestAnimationFrame(update);
          else el.textContent = target >= 1000 ? (target / 1000).toFixed(1) + 'k' : target;
        }
        requestAnimationFrame(update);
      });
    }

    window.addEventListener('load', () => {
      setTimeout(animateCounters, 800);
    });

    // 💖 Follow button dengan heart burst
    function followMe(btn, event) {
      if (btn.dataset.following === "1") {
        btn.dataset.following = "0";
        btn.textContent = "Follow";
        btn.classList.remove("following");
      } else {
        btn.dataset.following = "1";
        btn.textContent = "Following ✓";
        btn.classList.add("following");
        createHeartBurst(event.clientX, event.clientY);
      }
    }

    function createHeartBurst(x, y) {
      const hearts = ['💛', '🤎', '💚', '✨', '🌾', '🍂', '🌟'];
      for (let i = 0; i < 9; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart-burst';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = x + 'px';
        heart.style.top = y + 'px';
        const angle = (Math.PI * 2 * i) / 9;
        const distance = 60 + Math.random() * 40;
        heart.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        heart.style.setProperty('--ty', Math.sin(angle) * distance - 35 + 'px');
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1100);
      }
    }
  </script>

</body>
</html>
